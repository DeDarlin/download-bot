version: '3.8'

services:
  # Telegram Bot API Server (для файлов >50 МБ)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    ports:
      - "8081:8081"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    
  # Ваш бот
  bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - LOCAL_API_SERVER=http://telegram-bot-api:8081
    depends_on:
      - telegram-bot-api
    restart: unless-stopped
    volumes:
      - ./downloads:/app/downloads

volumes:
  bot-api-data:
